{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<title>note · Trebuchet</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/note.css" integrity="{{.CSSIntegrity}}">
<script src="/static/theme.js" integrity="{{.ThemeIntegrity}}"></script>
<script src="/static/note.js" integrity="{{.JSIntegrity}}" defer></script>
{{end}}

{{define "brand"}}<a class="brand" href="/" aria-label="Trebuchet note, новая записка">
    <svg class="mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect class="mk-bg" width="24" height="24" rx="5"/><path class="mk-arm" d="M6.5 17.5L16 8" stroke-width="2.2" stroke-linecap="round"/><rect class="mk-weight" x="14.5" y="14.5" width="4.5" height="4.5"/></svg>
    Trebuchet
  </a>
  <span class="tag">note</span>
  <span class="sp"></span>
  <button class="iconbtn" id="theme" type="button" aria-label="Тема: авто. Переключить" data-value="auto">
    <svg class="i" data-icon="auto" aria-hidden="true"><use href="#i-half"/></svg>
    <svg class="i" data-icon="light" aria-hidden="true" hidden><use href="#i-sun"/></svg>
    <svg class="i" data-icon="dark" aria-hidden="true" hidden><use href="#i-moon"/></svg>
  </button>
{{end}}

{{define "footer"}}<footer class="site gut">
  <span class="facts">AES-256-GCM в браузере · ключ после # не уходит на сервер · без cookies и аналитики</span>
  <a href="https://rima.su/">Trebuchet</a>
</footer>
{{end}}
